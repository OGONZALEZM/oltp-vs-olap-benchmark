# One Postgres instance serves both config A (schema `oltp`) and config B (schema `star`),
# so every server setting below is identical for A and B by construction.
# The planner/executor settings are pinned explicitly (not left to image defaults) and are
# recorded in the benchmark metadata.
services:
  postgres:
    image: postgres:16
    container_name: oltp-vs-olap-pg
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      # 5433 by default: 5432 is often taken by a local Postgres.
      - "${PG_PORT:-5433}:5432"
    # Parallel hash joins allocate dynamic shared memory in /dev/shm; Docker's 64 MB default
    # makes them fail with "could not resize shared memory segment".
    shm_size: 1gb
    command:
      - postgres
      # Pinned for the benchmark (identical for A and B):
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=2
      # JIT compile time is noisy on short aggregate queries; off for A and B alike.
      - -c
      - jit=off
      # Pinned for reproducibility of load and cache behaviour:
      - -c
      - shared_buffers=1GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
